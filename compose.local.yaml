services:
  db:
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"

  backend:
    environment:
      SPRING_PROFILES_ACTIVE: local
      ADMIN_BOOTSTRAP_ENABLED: "${ADMIN_BOOTSTRAP_ENABLED:-false}"
      ADMIN_LOGIN_IDENTIFIER: "${ADMIN_LOGIN_IDENTIFIER:-}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-}"
