services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: "${PRIMARY_DB_NAME:-toadzip}"
      POSTGRES_USER: "${PRIMARY_DB_USERNAME:-toadzip}"
      POSTGRES_PASSWORD: "${PRIMARY_DB_PASSWORD:?PRIMARY_DB_PASSWORD is required}"
    ports:
      - "127.0.0.1:${LOCAL_DB_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  db-shared:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: "${SHARED_DB_NAME:-toadzip_shared}"
      POSTGRES_USER: "${SHARED_DB_USERNAME:-toadzip}"
      POSTGRES_PASSWORD: "${SHARED_DB_PASSWORD:?SHARED_DB_PASSWORD is required}"
    ports:
      - "127.0.0.1:${LOCAL_SHARED_DB_PORT:-5434}:5432"
    volumes:
      - postgres_shared_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  backend:
    environment:
      SPRING_PROFILES_ACTIVE: local
      ADMIN_BOOTSTRAP_ENABLED: "${ADMIN_BOOTSTRAP_ENABLED:-false}"
      ADMIN_LOGIN_IDENTIFIER: "${ADMIN_LOGIN_IDENTIFIER:-}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-}"
    depends_on:
      db:
        condition: service_healthy
      db-shared:
        condition: service_healthy

volumes:
  postgres_data:
  postgres_shared_data:
