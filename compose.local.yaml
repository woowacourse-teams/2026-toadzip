services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: "${PRIMARY_DB_NAME:-toadzip}"
      POSTGRES_USER: "${PRIMARY_DB_USERNAME:-toadzip}"
      POSTGRES_PASSWORD: "${PRIMARY_DB_PASSWORD:?PRIMARY_DB_PASSWORD is required}"
    ports:
      - "127.0.0.1:${LOCAL_DB_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  db-shared:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: "${SHARED_DB_NAME:-toadzip_shared}"
      POSTGRES_USER: "${SHARED_DB_USERNAME:-toadzip}"
      POSTGRES_PASSWORD: "${SHARED_DB_PASSWORD:?SHARED_DB_PASSWORD is required}"
    ports:
      - "127.0.0.1:${LOCAL_SHARED_DB_PORT:-5434}:5432"
    volumes:
      - postgres_shared_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  db-lh-ownership-migration:
    image: postgres:17-alpine
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGDATABASE: "${PRIMARY_DB_NAME:-toadzip}"
      PGUSER: "${PRIMARY_DB_USERNAME:-toadzip}"
      PGPASSWORD: "${PRIMARY_DB_PASSWORD:?PRIMARY_DB_PASSWORD is required}"
    volumes:
      - ./backend/src/main/resources/db/migration:/migrations:ro
      - ./scripts/migrate-local-lh-ownership.sh:/migrate-local-lh-ownership.sh:ro
    entrypoint: ["sh", "/migrate-local-lh-ownership.sh"]
    restart: "no"

  backend:
    depends_on:
      db:
        condition: service_healthy
      db-shared:
        condition: service_healthy
      db-lh-ownership-migration:
        condition: service_completed_successfully

volumes:
  postgres_data:
  postgres_shared_data:
