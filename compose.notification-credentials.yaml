# Optional ADC file mount. Workload identity deployments do not need this overlay.
services:
  backend: &notification-credentials
    environment:
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/notification-firebase-adc.json
    volumes:
      - type: bind
        source: ${NOTIFICATION_FIREBASE_CREDENTIALS_FILE:?NOTIFICATION_FIREBASE_CREDENTIALS_FILE is required}
        target: /run/secrets/notification-firebase-adc.json
        read_only: true
        bind:
          create_host_path: false

  backend-blue:
    <<: *notification-credentials
    extends:
      file: compose.bluegreen.yaml
      service: backend-blue
    profiles: [bluegreen]

  backend-green:
    <<: *notification-credentials
    extends:
      file: compose.bluegreen.yaml
      service: backend-green
    profiles: [bluegreen]
