# Used with predicate-quantifier: some-with-excludes.
# Root configuration and shared tooling can affect both applications.
shared: &shared
  - '*'
  - '.github/**'
  - 'scripts/**'
  - 'tests/**'
  - 'docs/fixtures/**'
  - '!*.md'
  - '!.github/**/*.md'
  - '!scripts/**/*.md'
  - '!tests/**/*.md'

backend:
  - *shared
  - 'backend/**'
  # Backend contract tests read the worker's input and result examples.
  - 'ai-worker/contract/**'
  - '!backend/docs/**'
  - '!backend/*.md'

frontend:
  - *shared
  - 'frontend/**'
  # Frontend tests compare bundled region coordinates with this server-side source.
  - 'backend/src/main/resources/map-clustering/representative-points.csv'
  - '!frontend/docs/**'
  - '!frontend/*.md'
