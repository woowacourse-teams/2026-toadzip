name: Backend CI

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  backend:
    name: Backend Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Test Flyway migration guard
        run: python3 -B tests/ci/test_flyway_migrations.py
      - name: Check Flyway migrations
        env:
          # Compare the PR merge result with its develop base; deployments only check duplicates.
          MIGRATION_BASE_REF: ${{ github.event_name == 'pull_request' && github.base_ref == 'develop' && github.event.pull_request.base.sha || github.sha }}
        run: python3 scripts/check-flyway-migrations.py --base-ref "$MIGRATION_BASE_REF"
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - name: Verify backend with Testcontainers
        working-directory: backend
        run: ./gradlew --rerun-tasks check
      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: |
            backend/build/reports/tests/test/
            backend/build/test-results/test/
