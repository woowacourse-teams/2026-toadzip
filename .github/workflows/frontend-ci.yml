name: Frontend CI

on:
  pull_request:
  workflow_call:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: frontend-ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  frontend:
    name: Frontend Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - name: Detect changed paths
        if: github.event_name == 'pull_request'
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: .github/ci-paths.yml
          predicate-quantifier: some-with-excludes
      - name: Set up Node.js
        if: github.event_name != 'pull_request' || steps.filter.outputs.frontend == 'true'
        uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        if: github.event_name != 'pull_request' || steps.filter.outputs.frontend == 'true'
        run: npm ci
      - name: Verify notification deployment configuration
        if: github.event_name != 'pull_request' || steps.filter.outputs.frontend == 'true'
        run: python3 ../tests/deployment/test_notification_environment.py
      - name: Verify Blue/Green deployment scripts
        if: github.event_name != 'pull_request' || steps.filter.outputs.frontend == 'true'
        run: |
          python3 -B ../tests/deployment/test_bluegreen.py
          python3 -B ../tests/deployment/test_release_bluegreen.py
          python3 -B ../tests/deployment/test_rollback_bluegreen.py
          python3 -B ../tests/deployment/test_caddy_ingress.py
          python3 -B ../tests/deployment/test_prepare_bluegreen.py
      - name: Check frontend
        if: github.event_name != 'pull_request' || steps.filter.outputs.frontend == 'true'
        run: npm run check
