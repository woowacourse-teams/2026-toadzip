name: Frontend CI

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Verify notification deployment configuration
        run: python3 ../tests/deployment/test_notification_environment.py
      - name: Verify admin review folder exchange
        run: node --test ../tests/admin-review/exchange.test.mjs
      - name: Check frontend
        run: npm run check
