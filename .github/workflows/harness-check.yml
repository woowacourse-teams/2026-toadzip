name: Harness Check

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate harness
        run: sh scripts/validate-harness.sh
      - name: Test harness validator
        run: |
          sh tests/harness/validate-harness-test.sh
          sh tests/harness/contains-hangul-test.sh
          sh tests/harness/validate-commit-message-test.sh
          sh tests/harness/validate-pr-test.sh
      - name: Validate PR contract
        if: ${{ github.event_name == 'pull_request' }}
        env:
          BASE_BRANCH: ${{ github.event.pull_request.base.ref }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: sh scripts/validate-pr.sh "$BASE_BRANCH" "$HEAD_BRANCH" "$PR_TITLE"
      - name: Set up Java
        if: ${{ hashFiles('gradlew', 'backend/gradlew') != '' }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - name: Start test PostgreSQL
        id: start-postgres
        if: ${{ hashFiles('gradlew', 'backend/gradlew') != '' }}
        run: >-
          docker compose --project-name toadzip-test --file compose.test.yaml
          up --detach --wait --wait-timeout 60 --force-recreate db
      - name: Verify backend against PostgreSQL
        if: ${{ hashFiles('gradlew', 'backend/gradlew') != '' }}
        working-directory: backend
        run: ./gradlew --rerun-tasks check
      - name: Show PostgreSQL logs on failure
        if: ${{ failure() && steps.start-postgres.outcome == 'success' }}
        run: >-
          docker compose --project-name toadzip-test --file compose.test.yaml
          logs --no-color db
      - name: Stop test PostgreSQL
        if: >-
          ${{ always() &&
          (steps.start-postgres.outcome == 'success' || steps.start-postgres.outcome == 'failure') }}
        run: >-
          docker compose --project-name toadzip-test --file compose.test.yaml
          down --volumes --remove-orphans
