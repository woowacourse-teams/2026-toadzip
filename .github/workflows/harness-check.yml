name: Harness Check

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate harness
        run: |
          sh scripts/validate-local-artifacts.sh
          sh scripts/validate-harness.sh
      - name: Test harness validator
        run: |
          sh tests/harness/validate-harness-test.sh
          sh tests/harness/validate-local-artifacts-test.sh
          sh tests/harness/contains-hangul-test.sh
          sh tests/harness/validate-commit-message-test.sh
          sh tests/harness/validate-pr-test.sh
      - name: Validate PR contract
        if: ${{ github.event_name == 'pull_request' }}
        env:
          BASE_BRANCH: ${{ github.event.pull_request.base.ref }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: sh scripts/validate-pr.sh "$BASE_BRANCH" "$HEAD_BRANCH" "$PR_TITLE"

  backup:
    name: Backup Automation Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check backup scripts and monitoring
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          bash -n infra/db/deploy-backup-stack.sh infra/db/install-backup-automation.sh infra/db/run-scheduled-backup.sh
          bash tests/backup/backup-test.sh
          python3 tests/backup/monitor-test.py
          python3 infra/db/automation/render-template.py > /tmp/toadzip-backup-stack.json
          python3 -m json.tool /tmp/toadzip-backup-stack.json > /dev/null
