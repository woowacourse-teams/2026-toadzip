services:
  frontend:
    build:
      context: ./frontend
      args:
        VITE_NAVER_MAPS_CLIENT_ID: "${VITE_NAVER_MAPS_CLIENT_ID:-}"
        VITE_GA_MEASUREMENT_ID: "${VITE_GA_MEASUREMENT_ID:-}"
        VITE_POSTHOG_KEY: "${VITE_POSTHOG_KEY:-}"
        VITE_POSTHOG_HOST: "${VITE_POSTHOG_HOST:-https://us.i.posthog.com}"
        VITE_ANALYTICS_ENV: "${VITE_ANALYTICS_ENV:-}"
        VITE_POSTHOG_LOCAL_ENABLED: "${VITE_POSTHOG_LOCAL_ENABLED:-false}"
    image: toadzip-frontend:latest
    ports:
      - "${FRONTEND_PORT:-80}:8080"
    healthcheck:
      test:
        - CMD-SHELL
        - wget --quiet --output-document=- http://127.0.0.1:8080/healthz >/dev/null || exit 1
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    image: toadzip-backend:latest
    environment:
      SPRING_PROFILES_ACTIVE: "${SPRING_PROFILES_ACTIVE:-prod}"
      SPRING_DATASOURCE_URL: "jdbc:postgresql://${PRIMARY_DB_HOST:?PRIMARY_DB_HOST is required}:${PRIMARY_DB_PORT:-5432}/${PRIMARY_DB_NAME:-toadzip}"
      SPRING_DATASOURCE_USERNAME: "${PRIMARY_DB_USERNAME:-toadzip}"
      SPRING_DATASOURCE_PASSWORD: "${PRIMARY_DB_PASSWORD:?PRIMARY_DB_PASSWORD is required}"
      APP_DATASOURCE_SHARED_URL: "jdbc:postgresql://${SHARED_DB_HOST:?SHARED_DB_HOST is required}:${SHARED_DB_PORT:-5434}/${SHARED_DB_NAME:-toadzip_shared}"
      APP_DATASOURCE_SHARED_USERNAME: "${SHARED_DB_USERNAME:-toadzip}"
      APP_DATASOURCE_SHARED_PASSWORD: "${SHARED_DB_PASSWORD:?SHARED_DB_PASSWORD is required}"
      DATA_GO_KR_SERVICE_KEY: "${DATA_GO_KR_SERVICE_KEY:-}"
      ANNOUNCEMENT_ATTACHMENT_MAX_SIZE: "${ANNOUNCEMENT_ATTACHMENT_MAX_SIZE:-100MB}"
      ADMIN_CORS_ALLOWED_ORIGIN: "${ADMIN_CORS_ALLOWED_ORIGIN:-http://localhost:5173}"
      SESSION_COOKIE_SECURE: "${SESSION_COOKIE_SECURE:-false}"
      USER_OAUTH_ENABLED: "${USER_OAUTH_ENABLED:-false}"
      GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID:-}"
      GOOGLE_CLIENT_SECRET: "${GOOGLE_CLIENT_SECRET:-}"
      KAKAO_CLIENT_ID: "${KAKAO_CLIENT_ID:-}"
      KAKAO_CLIENT_SECRET: "${KAKAO_CLIENT_SECRET:-}"
      NAVER_SEARCH_CLIENT_ID: "${NAVER_SEARCH_CLIENT_ID:-}"
      NAVER_SEARCH_CLIENT_SECRET: "${NAVER_SEARCH_CLIENT_SECRET:-}"
      NAVER_MAPS_API_KEY_ID: "${NAVER_MAPS_API_KEY_ID:-}"
      NAVER_MAPS_API_KEY: "${NAVER_MAPS_API_KEY:-}"
      USER_OAUTH_REDIRECT_BASE_URL: "${USER_OAUTH_REDIRECT_BASE_URL:-}"
      USER_OAUTH_SUCCESS_URL: "${USER_OAUTH_SUCCESS_URL:-http://localhost/}"
      USER_OAUTH_FAILURE_URL: "${USER_OAUTH_FAILURE_URL:-http://localhost/?login=failed}"
      ADMIN_BOOTSTRAP_ENABLED: "${ADMIN_BOOTSTRAP_ENABLED:-false}"
      ADMIN_LOGIN_IDENTIFIER: "${ADMIN_LOGIN_IDENTIFIER:-}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-}"
    ports:
      - "${BACKEND_PORT:-8080}:8080"
      - "${MANAGEMENT_PORT:-8081}:8081"
    healthcheck:
      test:
        - CMD
        - curl
        - --fail
        - --silent
        - --show-error
        - --max-time
        - "4"
        - --output
        - /dev/null
        - http://127.0.0.1:8081/actuator/health
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    restart: unless-stopped

  alloy:
    image: grafana/alloy:v1.20.0
    command:
      - run
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    environment:
      DEPLOY_ENVIRONMENT: "${SPRING_PROFILES_ACTIVE:?SPRING_PROFILES_ACTIVE is required}"
      LOKI_PUSH_URL: "${LOKI_PUSH_URL:?LOKI_PUSH_URL is required}"
    volumes:
      - ./infra/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy_data:/var/lib/alloy/data
    restart: unless-stopped

volumes:
  alloy_data:
