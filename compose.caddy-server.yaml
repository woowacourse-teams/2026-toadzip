# Application-server ingress. Use instead of compose.https.yaml after the initial port cutover.
services:
  # 고정 관리 포트는 Edge가 맡고 기존 백엔드는 Docker 내부에서 접근한다.
  backend:
    ports: !reset []

  frontend:
    ports: !reset []
    command: [nginx, -c, /etc/nginx/nginx.conf, -g, 'daemon off;']
    environment: !reset {}
    group_add: !reset []
    volumes: !reset []

  edge-nginx:
    ports:
      - "${BLUEGREEN_METRICS_BIND_ADDRESS:?Set the application server private IP}:${MANAGEMENT_PORT:-8081}:8081"
    volumes:
      - type: bind
        source: "${EDGE_NGINX_CONF_DIR:-./infra/runtime/bluegreen/edge}"
        target: /etc/nginx/conf.d
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: "${EDGE_NGINX_ASSET_DIR:-./infra/runtime/bluegreen/assets}"
        target: /var/cache/toadzip/assets
        read_only: true
        bind:
          create_host_path: false

  caddy:
    extends:
      file: compose.caddy.yaml
      service: caddy
    environment:
      TOADZIP_CADDY_DOMAIN: "${TOADZIP_CADDY_DOMAIN:?Set the application server domain}"
    ports: !override
      - '80:80'
      - '443:443'
    depends_on:
      edge-nginx:
        condition: service_started

volumes:
  toadzip_caddy_data:
  toadzip_caddy_config:
