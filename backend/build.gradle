plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.0'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.toadzip'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-client'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.1.0'
	implementation 'org.locationtech.proj4j:proj4j:1.4.3'
	implementation 'org.jsoup:jsoup:1.23.2'
	implementation 'com.google.firebase:firebase-admin:9.11.0'
	implementation 'org.postgresql:postgresql'
	runtimeOnly 'org.flywaydb:flyway-database-postgresql'
	compileOnly 'org.projectlombok:lombok'
	runtimeOnly 'io.micrometer:micrometer-registry-prometheus'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-security-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.testcontainers:testcontainers-postgresql'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
	useJUnitPlatform()
	// Tests share PostgreSQL schemas, so keep execution sequential and reuse cached contexts.
	maxParallelForks = 1
	maxHeapSize = '2g'

	// Each CI shard has its own JVM and Testcontainers databases. Local test runs remain complete.
	def shard = providers.gradleProperty('testShard').orNull
	def ingestTests = ['com/toadzip/backend/ingest/**',
		'com/toadzip/backend/LocalProfileSchemaPersistenceTest*.class']
	if (shard == 'ingest') {
		include ingestTests
	} else if (shard == 'application') {
		exclude ingestTests
	} else if (shard != null) {
		throw new GradleException('testShard must be ingest or application; omit it to run all tests.')
	}
}
