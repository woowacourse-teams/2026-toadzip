spring:
  flyway:
    enabled: false
  datasource:
    # 접속 정보는 PostgresTestDatabaseInitializer가 실행 중인 컨테이너에서 주입한다.
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 4
  jpa:
    hibernate:
      # Cached contexts share this schema; evicting one must not drop tables used by another.
      # Testcontainers owns cleanup of the disposable test databases after the JVM exits.
      ddl-auto: create
  main:
    web-application-type: none

app:
  datasource:
    shared:
      driver-class-name: org.postgresql.Driver
