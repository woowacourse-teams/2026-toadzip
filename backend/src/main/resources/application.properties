spring.application.name=backend
logging.pattern.correlation=[traceId=%X{traceId:-}]\u0020
ingest.service-key=${DATA_GO_KR_SERVICE_KEY:}
ingest.base-url.myhome-complex=https://apis.data.go.kr/1613000/HWSPR04
ingest.base-url.myhome-announcement=https://apis.data.go.kr/1613000/HWSPR02
ingest.base-url.lh=https://apis.data.go.kr/B552555
ingest.lh-announcement-refresh-ttl=${LH_ANNOUNCEMENT_REFRESH_TTL:PT6H}
ingest.lh-announcement-recent-ended-refresh-ttl=${LH_ANNOUNCEMENT_RECENT_ENDED_REFRESH_TTL:PT24H}
ingest.lh-announcement-recent-ended-window=${LH_ANNOUNCEMENT_RECENT_ENDED_WINDOW:P30D}
ingest.scheduler.enabled=${INGEST_SCHEDULER_ENABLED:false}
ingest.scheduler.poll-interval-millis=${INGEST_SCHEDULER_POLL_INTERVAL_MILLIS:60000}
ingest.scheduler.announcement-interval=${INGEST_SCHEDULER_ANNOUNCEMENT_INTERVAL:PT6H}
ingest.scheduler.zone=${INGEST_SCHEDULER_ZONE:Asia/Seoul}
ingest.scheduler.complex-weekly-day=${INGEST_SCHEDULER_COMPLEX_WEEKLY_DAY:MONDAY}
ingest.scheduler.complex-weekly-time=${INGEST_SCHEDULER_COMPLEX_WEEKLY_TIME:03:00}
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

spring.servlet.multipart.max-file-size=${INGEST_MAX_FILE_SIZE:512MB}
spring.servlet.multipart.max-request-size=${INGEST_MAX_REQUEST_SIZE:512MB}

server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}

app.admin.cors.allowed-origin=${ADMIN_CORS_ALLOWED_ORIGIN:http://localhost:5173}
app.user.oauth.enabled=${USER_OAUTH_ENABLED:false}
app.user.oauth.google.client-id=${GOOGLE_CLIENT_ID:}
app.user.oauth.google.client-secret=${GOOGLE_CLIENT_SECRET:}
app.user.oauth.kakao.client-id=${KAKAO_CLIENT_ID:}
app.user.oauth.kakao.client-secret=${KAKAO_CLIENT_SECRET:}
app.user.oauth.redirect-base-url=${USER_OAUTH_REDIRECT_BASE_URL:}
app.user.oauth.success-url=${USER_OAUTH_SUCCESS_URL:http://localhost:5173/login}
app.user.oauth.failure-url=${USER_OAUTH_FAILURE_URL:http://localhost:5173/login?login=failed}

management.server.port=8081
management.endpoints.web.exposure.include=health,prometheus

app.admin.bootstrap.enabled=${ADMIN_BOOTSTRAP_ENABLED:false}
app.admin.bootstrap.login-identifier=${ADMIN_LOGIN_IDENTIFIER:}
app.admin.bootstrap.password=${ADMIN_PASSWORD:}
