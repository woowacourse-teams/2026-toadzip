spring.application.name=backend
logging.pattern.correlation=[traceId=%X{traceId:-}]\u0020
ingest.service-key=${DATA_GO_KR_SERVICE_KEY:}
ingest.base-url.myhome-complex=https://apis.data.go.kr/1613000/HWSPR04
ingest.base-url.myhome-announcement=https://apis.data.go.kr/1613000/HWSPR02
ingest.base-url.lh=https://apis.data.go.kr/B552555
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

spring.servlet.multipart.max-file-size=${INGEST_MAX_FILE_SIZE:512MB}
spring.servlet.multipart.max-request-size=${INGEST_MAX_REQUEST_SIZE:512MB}

server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}

app.admin.cors.allowed-origin=${ADMIN_CORS_ALLOWED_ORIGIN:http://localhost:5173}

management.server.port=8081
management.endpoints.web.exposure.include=health,prometheus

app.admin.bootstrap.enabled=${ADMIN_BOOTSTRAP_ENABLED:false}
app.admin.bootstrap.login-identifier=${ADMIN_LOGIN_IDENTIFIER:}
app.admin.bootstrap.password=${ADMIN_PASSWORD:}
