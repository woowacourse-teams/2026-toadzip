spring.application.name=backend
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.validation-timeout=2000
spring.datasource.hikari.data-source-properties.connectTimeout=5
spring.datasource.hikari.data-source-properties.loginTimeout=10
spring.datasource.hikari.data-source-properties.socketTimeout=${DB_SOCKET_TIMEOUT_SECONDS:120}
spring.datasource.hikari.data-source-properties.tcpKeepAlive=true
app.datasource.shared.configuration.connection-timeout=5000
app.datasource.shared.configuration.validation-timeout=2000
app.datasource.shared.configuration.data-source-properties.connectTimeout=5
app.datasource.shared.configuration.data-source-properties.loginTimeout=10
app.datasource.shared.configuration.data-source-properties.socketTimeout=${DB_SOCKET_TIMEOUT_SECONDS:120}
app.datasource.shared.configuration.data-source-properties.tcpKeepAlive=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=20260922.00
spring.flyway.clean-disabled=true
logging.pattern.correlation=[traceId=%X{traceId:-}]\u0020
ingest.service-key=${DATA_GO_KR_SERVICE_KEY:}
ingest.base-url.myhome-complex=https://apis.data.go.kr/1613000/HWSPR04
ingest.base-url.myhome-announcement=https://apis.data.go.kr/1613000/HWSPR02
ingest.base-url.lh=https://apis.data.go.kr/B552555
ingest.lh-announcement-client.max-concurrent-requests=${LH_ANNOUNCEMENT_MAX_CONCURRENT_REQUESTS:8}
ingest.lh-announcement-client.connect-timeout=${LH_ANNOUNCEMENT_CONNECT_TIMEOUT:PT3S}
ingest.lh-announcement-client.read-timeout=${LH_ANNOUNCEMENT_READ_TIMEOUT:PT10S}
ingest.lh-announcement-recent-ended-window=${LH_ANNOUNCEMENT_RECENT_ENDED_WINDOW:P30D}
# 자동 실행의 증분 수집이 다시 받는 마감 뒤 기간. 주 1회 전체 수집은 위 기간을 쓴다.
ingest.lh-announcement-incremental-ended-window=${LH_ANNOUNCEMENT_INCREMENTAL_ENDED_WINDOW:P3D}
ingest.lh-announcement-catalog-window=${LH_ANNOUNCEMENT_CATALOG_WINDOW:P2Y}
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

spring.servlet.multipart.max-file-size=${INGEST_MAX_FILE_SIZE:512MB}
spring.servlet.multipart.max-request-size=${INGEST_MAX_REQUEST_SIZE:512MB}

server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}

app.admin.cors.allowed-origin=${ADMIN_CORS_ALLOWED_ORIGIN:http://localhost:5173}
app.user.oauth.enabled=${USER_OAUTH_ENABLED:false}
app.user.oauth.google.client-id=${GOOGLE_CLIENT_ID:}
app.user.oauth.google.client-secret=${GOOGLE_CLIENT_SECRET:}
app.user.oauth.kakao.client-id=${KAKAO_CLIENT_ID:}
app.user.oauth.kakao.client-secret=${KAKAO_CLIENT_SECRET:}
app.search.naver-client-id=${NAVER_SEARCH_CLIENT_ID:}
app.search.naver-client-secret=${NAVER_SEARCH_CLIENT_SECRET:}
app.search.naver-maps-api-key-id=${NAVER_MAPS_API_KEY_ID:}
app.search.naver-maps-api-key=${NAVER_MAPS_API_KEY:}
app.location.juso-search-api-key=${JUSO_ADDRESS_API_KEY:}
app.location.juso-coordinate-api-key=${JUSO_COORDINATE_API_KEY:}
app.user.oauth.redirect-base-url=${USER_OAUTH_REDIRECT_BASE_URL:}
app.user.oauth.success-url=${USER_OAUTH_SUCCESS_URL:http://localhost:5173/explore}
app.user.oauth.failure-url=${USER_OAUTH_FAILURE_URL:http://localhost:5173/explore?login=failed}

management.server.port=8081
management.endpoints.web.exposure.include=health,prometheus

management.metrics.distribution.percentiles-histogram.http.server.requests=true
server.tomcat.mbeanregistry.enabled=true

app.announcement.attachments.max-size=${ANNOUNCEMENT_ATTACHMENT_MAX_SIZE:100MB}

# Opt-in rollout: keep activation-at fixed after the first publication.
app.notification.publisher-enabled=${NOTIFICATION_PUBLISHER_ENABLED:false}
app.notification.materializer-enabled=${NOTIFICATION_MATERIALIZER_ENABLED:false}
app.notification.delivery-enabled=${NOTIFICATION_DELIVERY_ENABLED:false}
app.notification.activation-at=${NOTIFICATION_ACTIVATION_AT:}
app.notification.frontend-origin=${NOTIFICATION_FRONTEND_ORIGIN:}
app.notification.firebase-project-id=${NOTIFICATION_FIREBASE_PROJECT_ID:}

app.notification.maintenance-enabled=${NOTIFICATION_MAINTENANCE_ENABLED:false}

# LH·SH·GH 공고 수집 자동 실행. 운영 환경에서 켠다. 확인 간격마다 실행 간격이 지난 유형 하나를 시작한다.
ingest.auto-collection.enabled=${INGEST_AUTO_COLLECTION_ENABLED:false}
ingest.auto-collection.initial-delay=${INGEST_AUTO_COLLECTION_INITIAL_DELAY:PT2M}
ingest.auto-collection.check-interval=${INGEST_AUTO_COLLECTION_CHECK_INTERVAL:PT10M}
ingest.auto-collection.interval=${INGEST_AUTO_COLLECTION_INTERVAL:PT3H}
ingest.auto-collection.full-collection-interval=${INGEST_AUTO_COLLECTION_FULL_INTERVAL:P7D}

# 마감 전이고 추출한 적 없는 공고의 공고문 PDF를 서버가 스스로 추출 작업(BATCH)으로 넣는다. 결과는 pdf-publication.mode가
# OFF면 관리자 검토 뒤에만, APPLY면 원문과 맞는 판정이 자동 공개로 반영된다(SHADOW는 판정만 기록).
# pdf-auto-extraction.enabled는 관리자가 운영 홈에서 한 번도 바꾸지 않았을 때의 기본값이다. 바꾼 뒤에는 DB 값이 이긴다.
# BATCH 작업은 워커가 관리자 작업 뒤에 꺼내고 Flex로 부른다. max-in-flight는 동시에 진행 중인 서버 작업 상한이다.
announcement.pdf-publication.mode=${PDF_PUBLICATION_MODE:OFF}
announcement.pdf-auto-extraction.enabled=${PDF_AUTO_EXTRACTION_ENABLED:false}
announcement.pdf-auto-extraction.initial-delay=${PDF_AUTO_EXTRACTION_INITIAL_DELAY:PT3M}
announcement.pdf-auto-extraction.check-interval=${PDF_AUTO_EXTRACTION_CHECK_INTERVAL:PT5M}
announcement.pdf-auto-extraction.max-in-flight=${PDF_AUTO_EXTRACTION_MAX_IN_FLIGHT:2}
