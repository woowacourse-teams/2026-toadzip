# 단지·공고·지역 페이지와 사이트맵의 백엔드 응답 공통 설정. app.conf의 SEO location이 include한다.
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
# 압축 응답에는 SSI가 적용되지 않으므로 백엔드에 압축을 요청하지 않는다.
proxy_set_header Accept-Encoding "";
proxy_connect_timeout 3s;
proxy_read_timeout 10s;
# 백엔드의 308은 그대로 내보낸다. 404는 상태를 유지한 채 앱 셸로 바꾼다. 배포 순서나 롤백으로
# 이 API가 없는 백엔드가 응답해도 JSON 오류 대신 앱이 열린다. 장애(5xx·연결 실패)에도 앱 셸을 주되
# 상태는 유지해 크롤러가 빈 셸을 정상 페이지로 색인하지 않고 다시 찾아오게 한다.
proxy_intercept_errors on;
error_page 404 500 502 503 504 /__app-shell;
