# API requests must be routed by Edge Nginx.
location = /api {
    return 404;
}

location ^~ /api/ {
    return 404;
}
# 단지·공고·지역 페이지 HTML과 사이트맵은 Edge Nginx를 거쳐 활성 백엔드에서 받는다.
# 변수로 넘겨 Edge가 늦게 떠도 Nginx가 시작되게 하고, 주소는 Docker DNS로 요청 때 찾는다.
resolver 127.0.0.11 valid=10s ipv6=off;
set $toadzip_seo_backend http://edge-nginx;
