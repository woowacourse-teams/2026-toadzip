root /usr/share/nginx/html;
index index.html;
# Keep redirects relative so Caddy's public scheme and host are preserved.
absolute_redirect off;

location = /healthz {
    access_log off;
    default_type text/plain;
    add_header Cache-Control "no-store" always;
    return 200 "ok\n";
}

include /etc/nginx/toadzip/api-proxy.conf;

location ^~ /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
}

location ^~ /region-boundaries/ {
    try_files $uri =404;
    types { application/geo+json geojson; }
    gzip on;
    gzip_types application/geo+json;
    gzip_vary on;
    add_header Cache-Control "public, max-age=31536000, immutable";
}

location = /street-view.html {
    try_files $uri =404;
    add_header Cache-Control "no-store" always;
    add_header Content-Security-Policy "frame-ancestors 'self'" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
}

# Route policy source: src/prerender/siteRoutes.ts (kept in sync by siteRoutes.test.ts).
# Public routes get prerendered HTML, other app routes get the SPA shell with noindex,
# and unknown paths get the SPA shell with a real 404 status.
location ^~ /prerendered/ {
    return 404;
}

location = /index.html {
    return 308 /$is_args$args;
}

location = / {
    # Old detail/filter/map links open the explorer directly (same rule as src/landing/explorerState.ts).
    if ($args ~ "(^|&)((complex|announcement|map)[^&=]*|boundaryRegionCode|login|tab|inbox)(=|&|$)") {
        return 308 /explore?$args;
    }
    add_header Cache-Control "no-store" always;
    try_files /prerendered/index.html /__app-shell;
}

location = /explore {
    # 예전 상세 링크는 상세 주소로 보낸다(같은 규칙: src/public-housing/navigation/detailLocation.ts).
    # 남는 complexId·announcementId 쿼리는 앱이 지운다.
    if ($arg_complexId ~ "^[1-9][0-9]{0,18}$") {
        return 308 /complexes/$arg_complexId?$args;
    }
    if ($arg_announcementId ~ "^[1-9][0-9]{0,18}$") {
        return 308 /announcements/$arg_announcementId?$args;
    }
    add_header Cache-Control "no-store" always;
    try_files /prerendered/explore/index.html /__app-shell;
}

# 단지·공고·지역 페이지는 백엔드가 페이지별 head와 본문을 만들고, 공통 head는 SSI로 이 빌드의 것을 끼운다.
# 형식이 맞지 않는 주소는 아래 location /에서 404가 된다.
location ~ "^/(complexes|announcements)/[1-9][0-9]{0,18}$" {
    ssi on;
    include /etc/nginx/toadzip/seo-proxy.conf;
    proxy_pass $toadzip_seo_backend/api/v1/seo/pages$uri;
}

location ~ "^/regions/[0-9]{2}(?:[0-9]{3})?(?:/[a-z0-9-]+)?$" {
    ssi on;
    include /etc/nginx/toadzip/seo-proxy.conf;
    proxy_pass $toadzip_seo_backend/api/v1/seo/pages$uri;
}

# 사이트맵 목록은 src/prerender/siteRoutes.ts의 DYNAMIC_SITEMAPS와 맞춘다. static.xml은 빌드 파일이다.
location ~ "^/sitemaps/(complexes|announcements|regions)\.xml$" {
    include /etc/nginx/toadzip/seo-proxy.conf;
    proxy_pass $toadzip_seo_backend/api/v1/seo$uri;
}

location = /__seo-head {
    internal;
    default_type text/html;
    try_files /prerendered/shared-head.html =500;
}

location ~ "^(?<path_without_slash>/.+)/$" {
    return 308 $path_without_slash$is_args$args;
}

location ~ "^/((admin|login|mypage|notifications|feedback)(/.*)?|privacy/.+)$" {
    add_header X-Robots-Tag "noindex" always;
    add_header Cache-Control "no-store" always;
    try_files /index.html =404;
}

location / {
    try_files $uri @app;
}

location @app {
    add_header Cache-Control "no-store" always;
    error_page 404 /__app-shell;
    try_files /prerendered$uri/index.html =404;
}

location = /__app-shell {
    internal;
    add_header Cache-Control "no-store" always;
    try_files /index.html =500;
}

location = /firebase-messaging-sw.js {
    try_files $uri =404;
    default_type application/javascript;
    add_header Cache-Control "no-cache" always;
}
location = /manifest.webmanifest {
    try_files $uri =404;
    default_type application/manifest+json;
    add_header Cache-Control "no-cache" always;
}
