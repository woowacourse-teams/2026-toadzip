root /usr/share/nginx/html;
index index.html;
# Keep redirects relative so Caddy's public scheme and host are preserved.
absolute_redirect off;

location = /healthz {
    access_log off;
    default_type text/plain;
    add_header Cache-Control "no-store" always;
    return 200 "ok\n";
}

include /etc/nginx/toadzip/api-proxy.conf;

location ^~ /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
}

location ^~ /region-boundaries/ {
    try_files $uri =404;
    types { application/geo+json geojson; }
    gzip on;
    gzip_types application/geo+json;
    gzip_vary on;
    add_header Cache-Control "public, max-age=31536000, immutable";
}

location = /street-view.html {
    try_files $uri =404;
    add_header Cache-Control "no-store" always;
    add_header Content-Security-Policy "frame-ancestors 'self'" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
}

# Route policy source: src/prerender/siteRoutes.ts (kept in sync by siteRoutes.test.ts).
# Public routes get prerendered HTML, other app routes get the SPA shell with noindex,
# and unknown paths get the SPA shell with a real 404 status.
location ^~ /prerendered/ {
    return 404;
}

location = /index.html {
    return 308 /$is_args$args;
}

location = / {
    # Old detail/filter/map links open the explorer directly (same rule as src/landing/explorerState.ts).
    if ($args ~ "(^|&)((complex|announcement|map)[^&=]*|boundaryRegionCode|login|tab|inbox)(=|&|$)") {
        return 308 /explore?$args;
    }
    add_header Cache-Control "no-store" always;
    try_files /prerendered/index.html /__app-shell;
}

location ~ "^(?<path_without_slash>/.+)/$" {
    return 308 $path_without_slash$is_args$args;
}

location ~ "^/((admin|login|mypage|notifications|feedback)(/.*)?|privacy/.+)$" {
    add_header X-Robots-Tag "noindex" always;
    add_header Cache-Control "no-store" always;
    try_files /index.html =404;
}

location / {
    try_files $uri @app;
}

location @app {
    add_header Cache-Control "no-store" always;
    error_page 404 /__app-shell;
    try_files /prerendered$uri/index.html =404;
}

location = /__app-shell {
    internal;
    add_header Cache-Control "no-store" always;
    try_files /index.html =500;
}

location = /firebase-messaging-sw.js {
    try_files $uri =404;
    default_type application/javascript;
    add_header Cache-Control "no-cache" always;
}
location = /manifest.webmanifest {
    try_files $uri =404;
    default_type application/manifest+json;
    add_header Cache-Control "no-cache" always;
}
