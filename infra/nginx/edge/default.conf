types { application/javascript mjs; }

upstream frontend_active {
    server frontend:8080;
}

upstream backend_active {
    server backend:8080;
}

# Port 81 is internal to Docker and accepts HTTPS traffic terminated by Caddy.
map $server_port $edge_forwarded_proto {
    default $scheme;
    81      https;
}

server {
    listen 80;
    listen 81;
    server_name _;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $edge_forwarded_proto;

    # /api 요청
    location = /api {
        proxy_pass http://backend_active;
    }

    # /api/로 시작하는 요청
    location ^~ /api/ {
        client_max_body_size 512m;
        proxy_request_buffering off;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        proxy_pass http://backend_active;
    }

    # Hashed files remain available after the originating frontend is stopped.
    location ^~ /assets/ {
        root /var/cache/toadzip;
        try_files $uri @frontend_assets;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location @frontend_assets {
        proxy_pass http://frontend_active;
    }

    # 나머지 요청
    location / {
        proxy_pass http://frontend_active;
    }
}

# 백엔드 메트릭 설정 시작
# API와 같은 활성 컨테이너를 가리키되 관리 포트로 전달한다.
upstream backend_metrics_active {
    server backend:8081;
}

# Caddy의 공개 요청 경로와 분리된 사설 관리 포트로 메트릭 요청을 받는다.
server {
    listen 8081;
    server_name _;
    # 다음 수집이 전환 전 worker의 기존 연결에 머무르지 않도록 한다.
    keepalive_timeout 0;

    location = /actuator/prometheus {
        proxy_pass http://backend_metrics_active;
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
        # 활성 백엔드 장애를 다른 대상이나 캐시 응답으로 숨기지 않는다.
        proxy_next_upstream off;
        proxy_cache off;
        # 배포 검증에서 실제로 선택한 컨테이너에 도착했는지 확인한다.
        add_header X-Toadzip-Metrics-Upstream $upstream_addr always;
    }

    # 이 포트에서는 다른 관리 API나 애플리케이션 경로를 제공하지 않는다.
    location / {
        return 404;
    }
}
# 백엔드 메트릭 설정 끝
