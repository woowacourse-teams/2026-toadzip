types { application/javascript mjs; }

upstream frontend_active {
    server frontend:8080;
}

upstream backend_active {
    server backend:8080;
}

# Port 81 is internal to Docker and accepts HTTPS traffic terminated by Caddy.
map $server_port $edge_forwarded_proto {
    default $scheme;
    81      https;
}

server {
    listen 80;
    listen 81;
    server_name _;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $edge_forwarded_proto;

    # /api 요청
    location = /api {
        proxy_pass http://backend_active;
    }

    # /api/로 시작하는 요청
    location ^~ /api/ {
        client_max_body_size 512m;
        proxy_request_buffering off;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        proxy_pass http://backend_active;
    }

    # Hashed files remain available after the originating frontend is stopped.
    location ^~ /assets/ {
        root /var/cache/toadzip;
        try_files $uri @frontend_assets;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location @frontend_assets {
        proxy_pass http://frontend_active;
    }

    # 나머지 요청
    location / {
        proxy_pass http://frontend_active;
    }
}
