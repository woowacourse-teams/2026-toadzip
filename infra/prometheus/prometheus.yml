global:
  scrape_interval: 15s

scrape_configs:
  - job_name: backend
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - 10.0.0.181:8081
        labels:
          environment: dev
          application: toadzip-backend

      - targets:
          - 10.0.0.236:8081
        labels:
          environment: prod
          application: toadzip-backend

  - job_name: db-host
    static_configs:
      - targets: []
        labels:
          role: database

  - job_name: postgres
    scrape_timeout: 10s
    static_configs:
      - targets: []
        labels:
          db_role: dev
      - targets: []
        labels:
          db_role: prod
      - targets: []
        labels:
          db_role: shared
